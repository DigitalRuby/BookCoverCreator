<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Cover Creator</title>
    <style>
        :root
        {
            --bg-color: #1e1e1e;
            --panel-color: #252526;
            --text-color: #cccccc;
            --accent-color: #007acc;
            --border-color: #3e3e42;
            --hover-color: #2d2d30;
            --menu-bg: #2d2d30;
        }

        *
        {
            box-sizing: border-box;
        }

        body
        {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Left Sidebar --- */
        .sidebar
        {
            width: 340px;
            background-color: var(--panel-color);
            border-right: 1px solid var(--border-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-shrink: 0;
            overflow-y: auto;
            z-index: 10;
        }

        h2
        {
            margin: 0;
            font-size: 1.1rem;
            color: #fff;
        }

        /* Tabs for Sidebar */
        .sidebar-section
        {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

            .sidebar-section.active
            {
                display: flex;
            }

        .btn-group
        {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn-tool
        {
            flex: 1;
            padding: 8px;
            background: #333;
            border: 1px solid var(--border-color);
            color: white;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

            .btn-tool:hover
            {
                background: #444;
            }

        .params-grid
        {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .control-group
        {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 100%;
        }

            .control-group.full
            {
                grid-column: span 2;
            }

        label
        {
            font-size: 0.7rem;
            color: #aaa;
            white-space: nowrap;
            display: flex;
            justify-content: space-between;
        }

        input[type="number"], input[type="text"], input[type="color"], select
        {
            background: #3c3c3c;
            border: 1px solid var(--border-color);
            color: white;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            width: 100%;
        }

            input[type="number"]:focus, input[type="text"]:focus
            {
                outline: none;
                border-color: var(--accent-color);
            }

        input[type="color"]
        {
            padding: 0;
            height: 30px;
            cursor: pointer;
        }

        input[type=range]
        {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

            input[type=range]::-webkit-slider-thumb
            {
                -webkit-appearance: none;
                height: 14px;
                width: 14px;
                border-radius: 50%;
                background: var(--accent-color);
                cursor: pointer;
                margin-top: -5px;
            }

            input[type=range]::-webkit-slider-runnable-track
            {
                width: 100%;
                height: 4px;
                background: #444;
                border-radius: 2px;
            }

        h3
        {
            font-size: 0.85rem;
            color: #999;
            margin: 2px 0 0 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        /* --- Drop Zones --- */
        .zones-container
        {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .drop-zone
        {
            background: var(--hover-color);
            border: 2px dashed var(--border-color);
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 5px;
            overflow: hidden;
        }

            .drop-zone:hover
            {
                border-color: #666;
                background-color: #333;
            }

            .drop-zone.active
            {
                border-color: var(--accent-color);
                background-color: #2d2d30;
            }

            .drop-zone.has-image
            {
                border-style: solid;
                border-color: #4caf50;
                background-color: #1e2e1e;
            }

            .drop-zone.is-template
            {
                border-color: #555;
                background-color: #222;
            }

            .drop-zone p
            {
                margin: 0;
                font-size: 0.9rem;
                font-weight: 600;
                pointer-events: none;
            }

            .drop-zone .info-block
            {
                display: flex;
                flex-direction: column;
                gap: 2px;
                margin-top: 4px;
                pointer-events: none;
            }

            .drop-zone .rect-info
            {
                font-family: monospace;
                font-size: 0.75rem;
                color: #aaa;
                background: rgba(0,0,0,0.2);
                padding: 2px 4px;
                border-radius: 3px;
            }

            .drop-zone .src-info
            {
                font-size: 0.7rem;
                color: #666;
            }

        .zone-large
        {
            height: 100px;
        }

        .zone-medium
        {
            height: 80px;
        }

        .offset-control
        {
            width: 100%;
            padding: 0 10px 5px 10px;
            margin-top: -5px;
        }

        .offset-label
        {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 2px;
        }

        /* --- Right Main Area --- */
        .main-area
        {
            flex-grow: 1;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            overflow: hidden; /* prevent scrollbars; we aspect-fit via JS */
            position: relative;
        }

        /* Canvas Container & Overlays */
        #canvas-wrapper
        {
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
            /* Background checkerboard */
            background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            max-width: 100%;
            max-height: 100%;
        }

        canvas
        {
            display: block;
            width: 100%;
            height: 100%; /* fill wrapper, we control wrapper size */
        }

        /* Overlay Items (HTML) */
        .overlay-item
        {
            position: absolute;
            user-select: none;
            cursor: grab;
            border: 1px solid transparent;
        }

            .overlay-item:hover
            {
                border: 1px dashed rgba(255,255,255,0.3);
            }

            .overlay-item.selected
            {
                border: 1px solid var(--accent-color);
                z-index: 100;
            }

        .overlay-content
        {
            white-space: normal;
            line-height: 1;
            transform-origin: center center;
            width: 100%;
            height: 100%;
            overflow: hidden;
            word-break: break-all;
            box-sizing: border-box;
        }

        /* Resize handles for text bounds */
        .resize-handle
        {
            position: absolute;
            background: transparent;
        }

        .resize-left,
        .resize-right
        {
            top: 15%;
            bottom: 15%;
            width: 8px;
            cursor: ew-resize;
        }

        .resize-left
        {
            left: -4px;
        }

        .resize-right
        {
            right: -4px;
        }

        .resize-top,
        .resize-bottom
        {
            left: 15%;
            right: 15%;
            height: 8px;
            cursor: ns-resize;
        }

        .resize-top
        {
            top: -4px;
        }

        .resize-bottom
        {
            bottom: -4px;
        }

        /* Three Dots Menu Button */
        .menu-trigger
        {
            position: absolute;
            top: -12px;
            right: -12px;
            width: 24px;
            height: 24px;
            background: var(--accent-color);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 101;
        }

        .overlay-item.selected .menu-trigger
        {
            display: flex;
        }

        .menu-trigger svg
        {
            width: 16px;
            height: 16px;
            fill: white;
        }

        /* Popup Menu */
        .popup-menu
        {
            position: absolute;
            top: 15px;
            right: -100px;
            width: 220px;
            background: var(--menu-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 200;
        }

            .popup-menu.show
            {
                display: flex;
            }

        .popup-row
        {
            display: flex;
            align-items: center;
            gap: 8px;
        }

            .popup-row label
            {
                width: 50px;
            }

        .icon-btn-group
        {
            display: flex;
            gap: 4px;
            background: #222;
            padding: 2px;
            border-radius: 4px;
        }

        .icon-btn
        {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 3px;
        }

            .icon-btn:hover
            {
                background: #444;
            }

            .icon-btn.active
            {
                background: var(--accent-color);
            }

            .icon-btn svg
            {
                width: 14px;
                height: 14px;
                fill: #ccc;
            }

            .icon-btn.active svg
            {
                fill: white;
            }

        button.btn-download
        {
            margin-top: auto;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            width: 100%;
            text-align: center;
        }

            button.btn-download:hover
            {
                background-color: #0063a5;
            }

        button.btn-back
        {
            background: transparent;
            border: 1px solid #666;
            color: #ccc;
            padding: 4px 8px;
            font-size: 0.8rem;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }

        .loader
        {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
            margin-left: 10px;
        }

        @keyframes spin
        {
            0%
            {
                transform: rotate(0deg);
            }

            100%
            {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <input type="file" id="file-template" hidden accept="image/*">
    <input type="file" id="file-back" hidden accept="image/*">
    <input type="file" id="file-spine" hidden accept="image/*">
    <input type="file" id="file-front" hidden accept="image/*">
    <input type="file" id="file-overlay-img" hidden accept="image/*">

    <div class="sidebar">
        <div style="display:flex; align-items:center; justify-content:space-between;">
            <h2>Cover Creator</h2>
            <div id="render-spinner" class="loader"></div>
        </div>

        <div id="panel-layout" class="sidebar-section active">
            <div class="params-grid">
                <div class="control-group">
                    <label>Width (in)</label>
                    <input type="number" id="finalWidth" step="0.01">
                </div>
                <div class="control-group">
                    <label>Height (in)</label>
                    <input type="number" id="finalHeight" step="0.01">
                </div>
                <div class="control-group full">
                    <label>Spine Width (in)</label>
                    <input type="number" id="spineWidth" step="0.01">
                </div>
                <div class="control-group">
                    <label>Spine Shade</label>
                    <input type="number" id="spineAlphaMultiplier" step="0.1">
                </div>
                <div class="control-group">
                    <label>Shade Curve</label>
                    <input type="number" id="spineAlphaPower" step="0.1">
                </div>
                <div class="control-group full">
                    <label><span>Opacity</span><span id="opacityVal">75%</span></label>
                    <input type="range" id="previewAlpha" min="0" max="1" step="0.01">
                </div>
            </div>

            <h3>Base Layers</h3>
            <div class="zones-container">
                <div class="drop-zone zone-medium is-template" id="dz-template" onclick="triggerFile('file-template')">
                    <p>Background Template</p>
                    <div class="info-block" id="info-template"><div class="src-info">Default Loaded</div></div>
                </div>
                <div class="drop-zone zone-large" id="dz-back" onclick="triggerFile('file-back')">
                    <p>Back Cover</p>
                    <div class="info-block" id="info-back"></div>
                </div>
                <div class="offset-control">
                    <div class="offset-label"><span>Offset</span><span id="lbl-backOffset">0%</span></div>
                    <input type="range" id="backOffset" min="-25" max="25" step="1" value="0">
                </div>
                <div class="drop-zone zone-medium" id="dz-spine" onclick="triggerFile('file-spine')">
                    <p>Spine</p>
                    <div class="info-block" id="info-spine"></div>
                </div>
                <div class="drop-zone zone-large" id="dz-front" onclick="triggerFile('file-front')">
                    <p>Front Cover</p>
                    <div class="info-block" id="info-front"></div>
                </div>
                <div class="offset-control">
                    <div class="offset-label"><span>Offset</span><span id="lbl-frontOffset">0%</span></div>
                    <input type="range" id="frontOffset" min="-25" max="25" step="1" value="0">
                </div>
            </div>

            <div class="btn-group">
                <div class="btn-tool" onclick="addTextOverlay()">+ Add Text</div>
                <div class="btn-tool" onclick="document.getElementById('file-overlay-img').click()">+ Add Image</div>
            </div>

            <button class="btn-download" onclick="downloadCanvas()">Download JPG</button>
        </div>

        <div id="panel-overlay" class="sidebar-section">
            <button class="btn-back" onclick="deselectOverlay()">&larr; Back to Layout</button>
            <h3 id="overlay-title">Text Properties</h3>

            <div class="control-group" id="group-text-content">
                <label>Text Content</label>
                <input type="text" id="prop-text-content">
            </div>

            <!-- Text Stroke / Image Outline -->
            <div id="group-outline">
                <h3>Stroke</h3>
                <div class="params-grid">
                    <div class="control-group">
                        <label>Color</label>
                        <input type="color" id="prop-outline-color" value="#000000">
                    </div>
                    <div class="control-group">
                        <label>Size</label>
                        <input type="number" id="prop-outline-size" step="0.5" min="0">
                    </div>
                    <div class="control-group full">
                        <label>Opacity</label>
                        <input type="range" id="prop-outline-opacity" min="0" max="1" step="0.1">
                    </div>
                </div>
            </div>

            <h3>Shadow</h3>
            <div class="params-grid">
                <div class="control-group">
                    <label>Color</label>
                    <input type="color" id="prop-shadow-color" value="#000000">
                </div>
                <div class="control-group">
                    <label>Blur/Size</label>
                    <input type="number" id="prop-shadow-size" step="1" min="0">
                </div>
                <div class="control-group full">
                    <label>Opacity</label>
                    <input type="range" id="prop-shadow-opacity" min="0" max="1" step="0.1">
                </div>
            </div>

            <!-- Border -->
            <h3>Border</h3>
            <div class="params-grid" id="group-border">
                <div class="control-group">
                    <label>Color</label>
                    <input type="color" id="prop-border-color" value="#ffffff">
                </div>
                <div class="control-group">
                    <label>Size</label>
                    <input type="number" id="prop-border-size" step="0.5" min="0">
                </div>
                <div class="control-group full">
                    <label>Opacity</label>
                    <input type="range" id="prop-border-opacity" min="0" max="1" step="0.1">
                </div>
                <div class="control-group full">
                    <label>Corner Radius</label>
                    <input type="number" id="prop-corner-radius" step="1" min="0">
                </div>
                <div class="control-group full">
                    <label>Padding</label>
                    <input type="number" id="prop-padding" step="1" min="0">
                </div>
            </div>

            <div id="group-text-bg">
                <h3>Background</h3>
                <div class="params-grid">
                    <div class="control-group">
                        <label>Type</label>
                        <select id="prop-bg-type">
                            <option value="none">None</option>
                            <option value="solid">Solid</option>
                            <option value="gradient">Gradient</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Color 1</label>
                        <input type="color" id="prop-bg-color1" value="#000000">
                    </div>
                    <div class="control-group">
                        <label>Color 2</label>
                        <input type="color" id="prop-bg-color2" value="#ffffff">
                    </div>
                    <div class="control-group">
                        <label>Direction</label>
                        <select id="prop-bg-direction">
                            <option value="vertical">Vertical</option>
                            <option value="horizontal">Horizontal</option>
                            <option value="diag1">Diag ↘</option>
                            <option value="diag2">Diag ↗</option>
                        </select>
                    </div>
                </div>
            </div>

            <div style="margin-top:20px;">
                <button class="btn-tool" style="background:#a32323; border:none; width:100%;" onclick="deleteSelectedOverlay()">Delete Item</button>
            </div>
        </div>
    </div>

    <div class="main-area" id="main-area">
        <div id="canvas-wrapper">
            <canvas id="previewCanvas"></canvas>
        </div>
    </div>

    <svg style="display:none">
        <symbol id="icon-dots" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" /></symbol>
        <symbol id="icon-left" viewBox="0 0 24 24"><path d="M3 15h18v-2H3v2zm0 4h12v-2H3v2zm0-8h18V9H3v2zm0-6v2h18V5H3z" /></symbol>
        <symbol id="icon-center" viewBox="0 0 24 24"><path d="M7 15v2h10v-2H7zm-4 6h18v-2H3v2zm0-8h18v-2H3v2zm4-6v2h10V7H7zM3 3v2h18V3H3z" /></symbol>
        <symbol id="icon-right" viewBox="0 0 24 24"><path d="M3 21h18v-2H3v2zm6-4h12v-2H9v2zm-6-4h18V9H3v2zm6-6v2h12V5H9z" /></symbol>
        <symbol id="icon-full" viewBox="0 0 24 24"><path d="M3 21h18v-2H3v2zm0-4h18v-2H3v2zm0-4h18V9H3v2zm0-4h18V5H3v2zm0-4v2h18V3H3z" /></symbol>
    </svg>

    <script>
        const DPI = 300;
        const RENDER_DELAY_MS = 600;

        // --- State ---
        const defaultParams = {
            width: 4065, height: 2775, spineWidth: 390,
            alphaMult: 2.0, alphaPower: 1.0, previewAlpha: 0.75,
            frontOffset: 0, backOffset: 0
        };

        let savedParams = localStorage.getItem('coverParams');
        let params = savedParams ? JSON.parse(savedParams) : defaultParams;
        if (typeof params.previewAlpha === 'undefined') params.previewAlpha = 0.75;

        // Overlays array
        let overlays = [];
        let selectedOverlayId = null;

        const state = {
            params: params,
            isCustomTemplate: false,
            images: { template: null, front: null, back: null, spine: null }
        };

        // --- CACHE & DOM ---
        let spineCacheCanvas = document.createElement('canvas');
        let isSpineCacheDirty = true;

        const dom = {
            width: document.getElementById('finalWidth'),
            height: document.getElementById('finalHeight'),
            spineW: document.getElementById('spineWidth'),
            aMult: document.getElementById('spineAlphaMultiplier'),
            aPower: document.getElementById('spineAlphaPower'),
            pAlpha: document.getElementById('previewAlpha'),
            pAlphaVal: document.getElementById('opacityVal'),
            canvas: document.getElementById('previewCanvas'),
            canvasWrapper: document.getElementById('canvas-wrapper'),
            spinner: document.getElementById('render-spinner'),
            frontOff: document.getElementById('frontOffset'),
            backOff: document.getElementById('backOffset'),
            mainArea: document.getElementById('main-area'),

            // Panels
            panelLayout: document.getElementById('panel-layout'),
            panelOverlay: document.getElementById('panel-overlay'),

            // Property Inputs
            propText: document.getElementById('prop-text-content'),
            propOutColor: document.getElementById('prop-outline-color'),
            propOutSize: document.getElementById('prop-outline-size'),
            propOutOp: document.getElementById('prop-outline-opacity'),
            propShadColor: document.getElementById('prop-shadow-color'),
            propShadSize: document.getElementById('prop-shadow-size'),
            propShadOp: document.getElementById('prop-shadow-opacity'),

            // Border, corner radius, padding, bg
            propBorderColor: document.getElementById('prop-border-color'),
            propBorderSize: document.getElementById('prop-border-size'),
            propBorderOp: document.getElementById('prop-border-opacity'),
            propCornerRadius: document.getElementById('prop-corner-radius'),
            propPadding: document.getElementById('prop-padding'),
            propBgType: document.getElementById('prop-bg-type'),
            propBgColor1: document.getElementById('prop-bg-color1'),
            propBgColor2: document.getElementById('prop-bg-color2'),
            propBgDir: document.getElementById('prop-bg-direction'),
            groupBorder: document.getElementById('group-border'),
            groupTextBg: document.getElementById('group-text-bg'),
            groupOutline: document.getElementById('group-outline')
        };

        // Init UI Inputs
        dom.width.value = (state.params.width / DPI).toFixed(2);
        dom.height.value = (state.params.height / DPI).toFixed(2);
        dom.spineW.value = (state.params.spineWidth / DPI).toFixed(2);
        dom.aMult.value = state.params.alphaMult;
        dom.aPower.value = state.params.alphaPower;
        dom.pAlpha.value = state.params.previewAlpha;
        dom.pAlphaVal.textContent = Math.round(state.params.previewAlpha * 100) + "%";
        dom.frontOff.value = state.params.frontOffset;
        dom.backOff.value = state.params.backOffset;

        // --- Helper / Utility functions ---

        function toRgba(hex, alpha)
        {
            hex = hex || '#000000';
            let c = hex.substring(1).split('');
            if (c.length === 3) c = [c[0], c[0], c[1], c[1], c[2], c[2]];
            c = '0x' + c.join('');
            return `rgba(${(c >> 16) & 255},${(c >> 8) & 255},${c & 255},${alpha})`;
        }

        function resetShadow(ctx)
        {
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
        }

        function applyShadowFromStyle(ctx, style, resScale, scale)
        {
            const s = style || {};
            const size = (s.shadowSize || 0);
            const opacity = (s.shadowOpacity != null ? s.shadowOpacity : 0);

            if (size > 0 && opacity > 0)
            {
                ctx.shadowColor = toRgba(s.shadowColor || '#000000', opacity);
                ctx.shadowBlur = size * 2 * resScale * (scale || 1);
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
            }
            else
            {
                resetShadow(ctx);
            }
        }

        function drawRoundedRect(ctx, x, y, width, height, radius)
        {
            radius = Math.max(0, radius || 0);
            const r = Math.min(radius, width / 2, height / 2);

            ctx.moveTo(x + r, y);
            ctx.lineTo(x + width - r, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + r);
            ctx.lineTo(x + width, y + height - r);
            ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
            ctx.lineTo(x + r, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function beginRoundedClip(ctx, rect)
        {
            ctx.save();
            ctx.beginPath();
            drawRoundedRect(ctx, rect.x, rect.y, rect.w, rect.h, rect.r || 0);
            ctx.clip();
        }

        function endClip(ctx)
        {
            ctx.restore();
        }

        function computeBoxModel(boxW, boxH, style, scaleMul, resScale)
        {
            style = style || {};
            const scale = scaleMul || 1;

            const borderBase = style.borderSize || 0;
            const borderPx = borderBase * resScale * scale;

            const paddingPx = (style.padding || 0) * resScale * scale;

            const outerX = -boxW / 2;
            const outerY = -boxH / 2;

            const borderRect = {
                x: outerX + borderPx / 2,
                y: outerY + borderPx / 2,
                w: Math.max(0, boxW - borderPx),
                h: Math.max(0, boxH - borderPx)
            };

            const contentRect = {
                x: outerX + borderPx + paddingPx,
                y: outerY + borderPx + paddingPx,
                w: Math.max(0, boxW - 2 * (borderPx + paddingPx)),
                h: Math.max(0, boxH - 2 * (borderPx + paddingPx))
            };

            const outerRadius = (style.cornerRadius || 0) * resScale * scale;
            const borderRadius = Math.max(0, outerRadius - borderPx / 2);
            const contentRadius = Math.max(0, borderRadius - paddingPx);

            borderRect.r = borderRadius;
            contentRect.r = contentRadius;

            return {
                borderPx,
                paddingPx,
                outerRect: { x: outerX, y: outerY, w: boxW, h: boxH, r: outerRadius },
                borderRect,
                contentRect
            };
        }

        function drawBackgroundForStyle(ctx, style, rect)
        {
            const s = style || {};
            if (!s.bgType || s.bgType === 'none') return;
            if (rect.w <= 0 || rect.h <= 0) return;

            let fill;

            if (s.bgType === 'solid')
            {
                fill = s.bgColor1 || '#000000';
            }
            else if (s.bgType === 'gradient')
            {
                const c1 = s.bgColor1 || '#000000';
                const c2 = s.bgColor2 || '#ffffff';
                let x0, y0, x1, y1;
                if (s.bgDirection === 'horizontal')
                {
                    x0 = rect.x; y0 = 0;
                    x1 = rect.x + rect.w; y1 = 0;
                }
                else if (s.bgDirection === 'diag1')
                {
                    x0 = rect.x; y0 = rect.y;
                    x1 = rect.x + rect.w; y1 = rect.y + rect.h;
                }
                else if (s.bgDirection === 'diag2')
                {
                    x0 = rect.x; y0 = rect.y + rect.h;
                    x1 = rect.x + rect.w; y1 = rect.y;
                }
                else
                {
                    x0 = 0; y0 = rect.y;
                    x1 = 0; y1 = rect.y + rect.h;
                }
                const grad = ctx.createLinearGradient(x0, y0, x1, y1);
                grad.addColorStop(0, c1);
                grad.addColorStop(1, c2);
                fill = grad;
            }
            else
            {
                return;
            }

            ctx.save();
            ctx.beginPath();
            drawRoundedRect(ctx, rect.x, rect.y, rect.w, rect.h, rect.r || 0);
            ctx.fillStyle = fill;
            ctx.fill();
            ctx.restore();
        }

        function drawBorderForStyle(ctx, style, rect, borderPx, defaultColor)
        {
            if (!borderPx || borderPx <= 0) return;
            if (rect.w <= 0 || rect.h <= 0) return;

            const s = style || {};

            resetShadow(ctx);
            ctx.save();
            ctx.beginPath();
            drawRoundedRect(ctx, rect.x, rect.y, rect.w, rect.h, rect.r || 0);
            ctx.strokeStyle = toRgba(
                s.borderColor || defaultColor || '#ffffff',
                s.borderOpacity != null ? s.borderOpacity : 1
            );
            ctx.lineWidth = borderPx;
            ctx.stroke();
            ctx.restore();
        }

        function wrapTextIntoLines(ctx, text, maxWidth, maxHeight, lineHeight)
        {
            const lines = [];
            let currentLine = '';

            if (!text || maxWidth <= 0 || maxHeight <= 0) return [];

            const maxLines = Math.max(1, Math.floor(maxHeight / lineHeight));

            for (let i = 0; i < text.length; i++)
            {
                const ch = text[i];
                const testLine = currentLine + ch;
                const testWidth = ctx.measureText(testLine).width;
                if (testWidth > maxWidth && currentLine.length > 0)
                {
                    lines.push(currentLine);
                    currentLine = ch;
                    if (lines.length >= maxLines) break;
                }
                else
                {
                    currentLine = testLine;
                }
            }

            if (lines.length < maxLines && currentLine.length > 0)
            {
                lines.push(currentLine);
            }

            return lines;
        }

        function getTextBoxGeometry(obj, canvasW, canvasH)
        {
            if (obj.boundsWidthPct && obj.boundsHeightPct)
            {
                const boxW = canvasW * (obj.boundsWidthPct / 100);
                const boxH = canvasH * (obj.boundsHeightPct / 100);

                const centerX = canvasW * ((obj.x + obj.boundsWidthPct / 2) / 100);
                const centerY = canvasH * ((obj.y + obj.boundsHeightPct / 2) / 100);

                return { centerX, centerY, boxW, boxH };
            }

            const el = document.getElementById('ov-' + obj.id);
            const wrapperRect = dom.canvasWrapper.getBoundingClientRect();
            if (el && wrapperRect.width > 0 && wrapperRect.height > 0)
            {
                const rect = el.getBoundingClientRect();
                const relX = (rect.left - wrapperRect.left) / wrapperRect.width;
                const relY = (rect.top - wrapperRect.top) / wrapperRect.height;
                const relW = rect.width / wrapperRect.width;
                const relH = rect.height / wrapperRect.height;

                const boxW = canvasW * relW;
                const boxH = canvasH * relH;
                const centerX = canvasW * (relX + relW / 2);
                const centerY = canvasH * (relY + relH / 2);

                return { centerX, centerY, boxW, boxH };
            }

            const boxW = canvasW * 0.3;
            const boxH = canvasH * 0.1;
            return { centerX: boxW / 2, centerY: boxH / 2, boxW, boxH };
        }

        function getImageBoxGeometry(obj, canvasW, canvasH, imgEl)
        {
            const imgW = imgEl.naturalWidth || imgEl.width || 1;
            const imgH = imgEl.naturalHeight || imgEl.height || 1;
            const aspect = imgH / imgW;
            const scale = obj.scale || 1;

            let baseWidthPct = obj.boundsWidthPct;
            if (!baseWidthPct)
            {
                baseWidthPct = 30;
            }

            const baseW = canvasW * (baseWidthPct / 100);
            const baseH = baseW * aspect;

            const visualW = baseW * scale;
            const visualH = baseH * scale;

            const topXPx = canvasW * (obj.x / 100);
            const topYPx = canvasH * (obj.y / 100);

            const centerX = topXPx + baseW / 2;
            const centerY = topYPx + baseH / 2; // keep center stable on scale

            return { centerX, centerY, baseW, baseH, visualW, visualH, scale };
        }

        // --- File Handlers ---
        window.triggerFile = function (id) { document.getElementById(id).click(); };

        function setupImageHandler(zoneId, fileInputId, imageKey, infoId)
        {
            const zone = document.getElementById(zoneId);
            const fileInput = document.getElementById(fileInputId);
            const handleFile = (file) =>
            {
                if (file && file.type.startsWith('image/'))
                {
                    const reader = new FileReader();
                    reader.onload = (e) =>
                    {
                        const img = new Image();
                        img.onload = () =>
                        {
                            state.images[imageKey] = img;
                            if (imageKey === 'template')
                            {
                                state.isCustomTemplate = true;
                                zone.classList.remove('is-template');
                            }
                            if (imageKey === 'spine') isSpineCacheDirty = true;
                            zone.classList.add('has-image');
                            updateLabels();
                            requestRender();
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };
            fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
            if (zone)
            {
                zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('active'); });
                zone.addEventListener('dragleave', (e) => { e.preventDefault(); zone.classList.remove('active'); });
                zone.addEventListener('drop', (e) => { e.preventDefault(); zone.classList.remove('active'); handleFile(e.dataTransfer.files[0]); });
            }
        }

        setupImageHandler('dz-template', 'file-template', 'template', 'info-template');
        setupImageHandler('dz-back', 'file-back', 'back', 'info-back');
        setupImageHandler('dz-front', 'file-front', 'front', 'info-front');

        function addTextOverlay()

            renderDomOverlays();
            selectOverlay(obj.id);

        function deleteSelectedOverlay()
        {
            if (selectedOverlayId)
            {
                overlays = overlays.filter(o => o.id !== selectedOverlayId);
                deselectOverlay();
                renderDomOverlays();
            }
        }

        function selectOverlay(id)
        {
            selectedOverlayId = id;

            dom.panelLayout.classList.remove('active');
            dom.panelOverlay.classList.add('active');

            const obj = overlays.find(o => o.id === id);
            if (!obj) return;

            const isText = obj.type === 'text';
            document.getElementById('overlay-title').textContent = isText ? "Text Properties" : "Image Properties";
            document.getElementById('group-text-content').style.display = isText ? 'flex' : 'none';

            if (isText) dom.propText.value = obj.content;

            const s = obj.style;

            dom.propOutColor.value = s.outlineColor ?? '#000000';
            dom.propOutSize.value = s.outlineSize ?? 0;
            dom.propOutOp.value = s.outlineOpacity ?? 1;

            dom.propShadColor.value = s.shadowColor ?? '#000000';
            dom.propShadSize.value = s.shadowSize ?? 0;
            dom.propShadOp.value = s.shadowOpacity ?? 1;

            dom.propBorderColor.value = s.borderColor ?? '#ffffff';
            dom.propBorderSize.value = s.borderSize ?? 0;
            dom.propBorderOp.value = s.borderOpacity ?? 1;
            dom.propCornerRadius.value = s.cornerRadius ?? 0;
            dom.propPadding.value = s.padding ?? 0;

            dom.propBgType.value = s.bgType ?? 'none';
            dom.propBgColor1.value = s.bgColor1 ?? '#000000';
            dom.propBgColor2.value = s.bgColor2 ?? '#ffffff';
            dom.propBgDir.value = s.bgDirection ?? 'vertical';

            dom.groupTextBg.style.display = isText ? 'grid' : 'none';
            dom.groupBorder.style.display = 'grid';

            if (dom.groupOutline)

                dom.groupOutline.style.display = isText ? 'block' : 'none';

            document.querySelectorAll('.overlay-item').forEach(el => el.classList.remove('selected'));
            const el = document.getElementById('ov-' + id);
            if (el) el.classList.add('selected');

        {

            document.querySelectorAll('.overlay-item').forEach(el => el.classList.remove('selected'));

        dom.propShadColor.addEventListener('input', e => updateSelectedStyle('shadowColor', e.target.value));
        dom.propShadSize.addEventListener('input', e => updateSelectedStyle('shadowSize', parseFloat(e.target.value)));

        function updateSelectedProp(key, val)
        {
            if (!selectedOverlayId) return;
            const obj = overlays.find(o => o.id === selectedOverlayId);
            if (obj)
            {
                obj[key] = val;

                const el = document.getElementById('ov-' + obj.id);
                if (el)
                {
                    const contentDiv = el.querySelector('.overlay-content');
                    if (obj.type === 'text' && contentDiv)
                    {
                        contentDiv.textContent = obj.content;
                    }
                }

                updateDomOverlayStyle(obj);
            }
        }

        function updateSelectedStyle(key, val)
        {
            if (!selectedOverlayId) return;
            const obj = overlays.find(o => o.id === selectedOverlayId);
            if (obj)
            {
                obj.style[key] = val;
                updateDomOverlayStyle(obj);
            }
        }

        // --- DOM RENDERER FOR OVERLAYS ---
        function renderDomOverlays()
        {
            const currentIds = overlays.map(o => 'ov-' + o.id);
            document.querySelectorAll('.overlay-item').forEach(el =>
            {
                if (!currentIds.includes(el.id)) el.remove();
            });

            overlays.forEach(obj =>
            {
                let el = document.getElementById('ov-' + obj.id);
                if (!el)
                {
                    el = document.createElement('div');
                    el.id = 'ov-' + obj.id;
                    el.className = 'overlay-item';
                    el.addEventListener('mousedown', (e) => handleDragStart(e, obj.id));

                    const trig = document.createElement('div');
                    trig.className = 'menu-trigger';
                    trig.innerHTML = '<svg><use href="#icon-dots"/></svg>';
                    trig.onclick = (e) => { e.stopPropagation(); toggleMenu(obj.id); };
                    el.appendChild(trig);

                    const menu = document.createElement('div');
                    menu.className = 'popup-menu';
                    menu.id = 'menu-' + obj.id;
                    menu.innerHTML = generateMenuHTML(obj);
                    el.appendChild(menu);

                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'overlay-content';
                    el.appendChild(contentDiv);

                    dom.canvasWrapper.appendChild(el);
                }

                const contentDiv = el.querySelector('.overlay-content');

                if (obj.type === 'text')
                {
                    ['left', 'right', 'top', 'bottom'].forEach(side =>
                    {
                        if (!el.querySelector('.resize-' + side))
                        {
                            const h = document.createElement('div');
                            h.className = 'resize-handle resize-' + side;
                            h.addEventListener('mousedown', (e) => startResize(e, obj.id, side));
                            el.appendChild(h);
                        }
                    });

                    contentDiv.textContent = obj.content;
                } else
                {
                    const existingHandles = el.querySelectorAll('.resize-handle');
                    existingHandles.forEach(h => h.remove());

                    if (!contentDiv.querySelector('img'))
                    {
                        const img = document.createElement('img');
                        img.draggable = false;
                        img.style.display = 'block';
                        img.style.pointerEvents = 'none';
                        contentDiv.appendChild(img);
                    }
                    contentDiv.querySelector('img').src = obj.content;
                }

                updateDomOverlayStyle(obj);
            });
        }

        function generateMenuHTML(obj)
        {
            let html = '';

            html += `<div class="popup-row"><label>Rot</label><input type="range" min="0" max="360" value="${obj.rotation}" oninput="updateTransform('${obj.id}', 'rotation', this.value)"></div>`;

            html += `<div class="popup-row"><label>Scale</label><input type="range" min="0.1" max="3" step="0.1" value="${obj.type === 'text' ? obj.fontScale : obj.scale}" oninput="updateTransform('${obj.id}', 'scale', this.value)"></div>`;

            if (obj.type === 'text')
            {
                html += `<div class="popup-row"><label>Font</label><select onchange="updateTransform('${obj.id}', 'fontFamily', this.value)">

                                            <option value="Verdana" ${obj.fontFamily == 'Verdana' ? 'selected' : ''}>Verdana</option>
                                            <option value="Impact" ${obj.fontFamily == 'Impact' ? 'selected' : ''}>Impact</option>
                                        </select></div>`;

                html += `<div class="popup-row"><label>Align</label><div class="icon-btn-group">

        window.updateTransform = function (id, key, val)
        {
            const obj = overlays.find(o => o.id === id);
            if (obj)
            {
                if (key === 'scale')
                {
                    if (obj.type === 'text')
                    {
                        obj.fontScale = parseFloat(val);
                    } else
                    {
                        obj.scale = parseFloat(val);
                    }
                }
                else if (key === 'rotation')
                {
                    obj.rotation = parseFloat(val);
                }
                else
                {
                    obj[key] = val;
                }

                if (key === 'align')
                {
                    document.getElementById('menu-' + id).innerHTML = generateMenuHTML(obj);
                }
                updateDomOverlayStyle(obj);
            }

        function toggleMenu(id)
        {

        function updateDomOverlayStyle(obj)
        {
            const el = document.getElementById('ov-' + obj.id);
            if (!el) return;
            const content = el.querySelector('.overlay-content');
            const img = content.querySelector('img');

            if (obj.type === 'text' && (!obj.boundsHeightPct || obj.boundsHeightPct <= 0))

            }

            el.style.left = obj.x + '%';
            el.style.top = obj.y + '%';

            if (obj.boundsWidthPct)
            {
                el.style.width = obj.boundsWidthPct + '%';
            } else
            {
                el.style.width = 'auto';
            }

            if (obj.boundsHeightPct)
            {
                el.style.height = obj.boundsHeightPct + '%';
            } else
            {
                el.style.height = 'auto';
            }

            if (obj.type === 'image')
            {
                content.style.transform = `rotate(${obj.rotation}deg) scale(${obj.scale})`;
            } else
            {
                content.style.transform = `rotate(${obj.rotation}deg)`;
            }

            const s = obj.style;
            const hexToRgbA = (hex, alpha) =>
            {
                hex = hex || '#000000';
                let c = hex.substring(1).split('');
                if (c.length == 3) c = [c[0], c[0], c[1], c[1], c[2], c[2]];
                c = '0x' + c.join('');
                return 'rgba(' + [(c >> 16) & 255, (c >> 8) & 255, c & 255].join(',') + ',' + alpha + ')';
            };

            const hasShadow = (s.shadowSize > 0 && s.shadowOpacity > 0);
            const shadowColorCss = hexToRgbA(s.shadowColor || '#000000', (s.shadowOpacity != null ? s.shadowOpacity : 1));
            const shadowStr = hasShadow ? `drop-shadow(0px 0px ${s.shadowSize}px ${shadowColorCss})` : 'none';
            const cornerRadiusPx = (s.cornerRadius || 0) + 'px';
            const paddingPx = (s.padding || 0) + 'px';

            el.style.borderRadius = cornerRadiusPx;

            if (obj.type === 'text')
            {
                content.style.fontFamily = obj.fontFamily;
                const basePx = 50;
                content.style.fontSize = (basePx * obj.fontScale) + "px";
                content.style.color = "#FFFFFF";
                content.style.textAlign = obj.align;

                content.style.padding = paddingPx;

                if (s.outlineSize > 0)
                {
                    content.style.webkitTextStroke = `${s.outlineSize}px ${hexToRgbA(s.outlineColor, s.outlineOpacity)}`;
                } else
                {
                    content.style.webkitTextStroke = '0';
                }

                content.style.filter = 'none';
                if (hasShadow)
                {
                    content.style.textShadow = `0px 0px ${s.shadowSize}px ${shadowColorCss}`;
                }
                else
                {
                    content.style.textShadow = 'none';
                }

                if (s.bgType === 'none')
                {
                    content.style.background = 'transparent';
                }
                else if (s.bgType === 'solid')
                {
                    content.style.background = s.bgColor1 || '#000000';
                }
                else if (s.bgType === 'gradient')
                {
                    const c1 = s.bgColor1 || '#000000';
                    const c2 = s.bgColor2 || '#ffffff';
                    let dir = 'to bottom';
                    if (s.bgDirection === 'horizontal') dir = 'to right';
                    else if (s.bgDirection === 'diag1') dir = 'to bottom right';
                    else if (s.bgDirection === 'diag2') dir = 'to top right';
                    content.style.background = `linear-gradient(${dir}, ${c1}, ${c2})`;
                }

                const borderColor = s.borderColor || '#ffffff';
                const borderSize = s.borderSize || 0;
                const borderOpacity = (s.borderOpacity != null ? s.borderOpacity : 1);
                if (borderSize > 0)
                {
                    content.style.border = `${borderSize}px solid ${hexToRgbA(borderColor, borderOpacity)}`;
                }
                else
                {
                    content.style.border = 'none';
                }

                content.style.borderRadius = cornerRadiusPx;

            } else if (img)
            {
                const borderColor = s.borderColor || '#ffffff';
                const borderSize = s.borderSize || 0;
                const borderOpacity = (s.borderOpacity != null ? s.borderOpacity : 1);

                content.style.padding = paddingPx;
                content.style.borderRadius = cornerRadiusPx;

                if (borderSize > 0)
                {
                    content.style.border = `${borderSize}px solid ${hexToRgbA(borderColor, borderOpacity)}`;
                }
                else
                {
                    content.style.border = 'none';
                }

                img.style.filter = shadowStr;
                img.style.width = "100%";
                img.style.height = "auto";
                img.style.border = 'none';
                img.style.borderRadius = 'inherit';
            }
        }

        // --- DRAG & RESIZE LOGIC ---
        let isDragging = false;
        let activeDragId = null;
        let dragStartMouse = { x: 0, y: 0 };
        let dragStartObjPos = { x: 0, y: 0 };

        let isResizing = false;
        let resizeData = null;

        function handleDragStart(e, id)
        {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'LABEL' || e.target.closest('.popup-menu') || e.target.classList.contains('resize-handle')) return;

            isDragging = true;
            activeDragId = id;
            selectOverlay(id);

            const obj = overlays.find(o => o.id === id);
            if (!obj) return;

            dragStartMouse.x = e.clientX;
            dragStartMouse.y = e.clientY;
            dragStartObjPos.x = obj.x;
            dragStartObjPos.y = obj.y;

            e.stopPropagation();
        }

        function startResize(e, id, side)
        {
            e.stopPropagation();
            isResizing = true;
            resizeData = {
                id,
                side,
                startX: e.clientX,
                startY: e.clientY
            };
            selectOverlay(id);
        }

        document.addEventListener('mousemove', (e) =>
        {
            if (isDragging && activeDragId)
            {
                const obj = overlays.find(o => o.id === activeDragId);
                if (!obj) return;

                const wrapperRect = dom.canvasWrapper.getBoundingClientRect();
                const dx = e.clientX - dragStartMouse.x;
                const dy = e.clientY - dragStartMouse.y;

                const dxPct = (dx / wrapperRect.width) * 100;
                const dyPct = (dy / wrapperRect.height) * 100;

                obj.x = dragStartObjPos.x + dxPct;
                obj.y = dragStartObjPos.y + dyPct;

                updateDomOverlayStyle(obj);
            }
            else if (isResizing && resizeData)
            {
                const obj = overlays.find(o => o.id === resizeData.id);
                if (!obj || obj.type !== 'text') return;

                const el = document.getElementById('ov-' + obj.id);
                const wrapperRect = dom.canvasWrapper.getBoundingClientRect();
                const rect = el.getBoundingClientRect();

                const side = resizeData.side;

                if (side === 'left' || side === 'right')
                {
                    const deltaX = e.clientX - resizeData.startX;

                    let newLeft = rect.left;
                    let newRight = rect.right;

                    if (side === 'right')
                    {
                        newRight = rect.right + deltaX;
                    }
                    else if (side === 'left')
                    {
                        newLeft = rect.left + deltaX;
                    }

                    let newWidthPx = newRight - newLeft;
                    const minWidthPx = 40;
                    if (newWidthPx < minWidthPx)
                    {
                        newWidthPx = minWidthPx;
                    }

                    const widthPct = (newWidthPx / wrapperRect.width) * 100;
                    const leftPct = ((newLeft - wrapperRect.left) / wrapperRect.width) * 100;

                    obj.boundsWidthPct = Math.max(5, Math.min(100, widthPct));
                    obj.x = Math.max(0, Math.min(100 - obj.boundsWidthPct, leftPct));

                    resizeData.startX = e.clientX;
                }

                if (side === 'top' || side === 'bottom')
                {
                    const deltaY = e.clientY - resizeData.startY;

                    let newTop = rect.top;
                    let newBottom = rect.bottom;

                    if (side === 'bottom')
                    {
                        newBottom = rect.bottom + deltaY;
                    }
                    else if (side === 'top')
                    {
                        newTop = rect.top + deltaY;
                    }

                    let newHeightPx = newBottom - newTop;
                    const minHeightPx = 30;
                    if (newHeightPx < minHeightPx)
                    {
                        newHeightPx = minHeightPx;
                    }

                    const heightPct = (newHeightPx / wrapperRect.height) * 100;
                    const topPct = ((newTop - wrapperRect.top) / wrapperRect.height) * 100;

                    obj.boundsHeightPct = Math.max(3, Math.min(100, heightPct));
                    obj.y = Math.max(0, Math.min(100 - obj.boundsHeightPct, topPct));

                    resizeData.startY = e.clientY;
                }

                updateDomOverlayStyle(obj);
            }
        });

        document.addEventListener('mouseup', () =>
        {
            isDragging = false;
            activeDragId = null;
            isResizing = false;
            resizeData = null;
        });

        dom.canvasWrapper.addEventListener('mousedown', (e) =>
        {
            if (e.target.id === 'previewCanvas' || e.target.id === 'canvas-wrapper')
            {
                deselectOverlay();
            }
        });

        // --- RENDERING ---

        function calculateGeometry()
        {
            const p = state.params;
            const frontWidth = Math.floor((p.width - p.spineWidth) / 2);
            const backWidth = p.width - frontWidth - p.spineWidth;
            const blendWidth = Math.floor(p.spineWidth / 2);
            return {
                final: { w: p.width, h: p.height },
                spine: { x: backWidth, y: 0, w: p.spineWidth, h: p.height },
                back: { x: 0, y: 0, w: backWidth, h: p.height },
                front: { x: backWidth + p.spineWidth, y: 0, w: frontWidth, h: p.height },
                blendLeft: { x: backWidth, y: 0, w: blendWidth, h: p.height },
                blendRight: { x: backWidth + blendWidth, y: 0, w: blendWidth, h: p.height }
            };
        }

        function updateCanvasWrapperSize()
        {
            const geo = calculateGeometry();
            const coverW = geo.final.w;
            const coverH = geo.final.h;

            const mainRect = dom.mainArea.getBoundingClientRect();
            // main-area padding is 8px all around
            const paddingX = 16;
            const paddingY = 16;

            const availW = Math.max(10, mainRect.width - paddingX);
            const availH = Math.max(10, mainRect.height - paddingY);

            const scale = Math.min(availW / coverW, availH / coverH);

            const displayW = coverW * scale;
            const displayH = coverH * scale;

            dom.canvasWrapper.style.width = displayW + 'px';
            dom.canvasWrapper.style.height = displayH + 'px';

            dom.canvas.style.width = '100%';
            dom.canvas.style.height = '100%';
        }

        function requestRender()
        {
            updateCanvasWrapperSize();
            renderToCanvas(dom.canvas, false);
        }

        function renderToCanvas(targetCanvas, isExport)
        {
            const geo = calculateGeometry();

            if (isSpineCacheDirty) { updateSpineCache(geo.spine); isSpineCacheDirty = false; }

            if (targetCanvas.width !== geo.final.w || targetCanvas.height !== geo.final.h)
            {
                targetCanvas.width = geo.final.w; targetCanvas.height = geo.final.h;
            }

            const ctx = targetCanvas.getContext('2d');
            ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);

            if (!isExport && state.images.template)
            {
                ctx.drawImage(state.images.template, 0, 0, geo.final.w, geo.final.h);
            }

            const offCanvas = document.createElement('canvas');
            offCanvas.width = geo.final.w; offCanvas.height = geo.final.h;
            const oCtx = offCanvas.getContext('2d');
            drawCompositeLayer(oCtx, geo);

            ctx.save();
            if (!isExport) ctx.globalAlpha = state.params.previewAlpha;
            ctx.drawImage(offCanvas, 0, 0);
            ctx.restore();

            if (isExport)
            {
                renderOverlaysToContext(ctx, geo.final.w, geo.final.h);
            }
        }

        function renderOverlaysToContext(ctx, canvasW, canvasH)
        {
            const wrapperRect = dom.canvasWrapper.getBoundingClientRect();
            const previewW = wrapperRect.width || canvasW;
            const resScale = canvasW / previewW;

            overlays.forEach(obj =>
            {
                const style = obj.style || {};

                if (obj.type === 'text')
                {
                    const geo = getTextBoxGeometry(obj, canvasW, canvasH);
                    const centerX = geo.centerX;
                    const centerY = geo.centerY;
                    const boxW = geo.boxW;
                    const boxH = geo.boxH;

                    const layout = computeBoxModel(boxW, boxH, style, 1, resScale);
                    const borderPx = layout.borderPx;
                    const borderRect = layout.borderRect;
                    const contentRect = layout.contentRect;

                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(obj.rotation * Math.PI / 180);

                    resetShadow(ctx);
                    drawBackgroundForStyle(ctx, style, borderRect);
                    drawBorderForStyle(ctx, style, borderRect, borderPx, '#ffffff');

                    const basePx = 50;
                    const fontSize = basePx * (obj.fontScale || 1) * resScale;
                    ctx.font = `${fontSize}px ${obj.fontFamily}`;
                    ctx.fillStyle = "white";
                    ctx.textBaseline = "top";

                    const lineHeight = fontSize * 1.2;
                    const lines = wrapTextIntoLines(
                        ctx,
                        obj.content || '',
                        contentRect.w,
                        contentRect.h,
                        lineHeight
                    );

                    const outlinePx = (style.outlineSize || 0) * resScale;
                    const shadowMargin = (style.shadowSize || 0) * 2 * resScale;
                    const clipMargin = outlinePx + shadowMargin + 2;

                    ctx.beginPath();
                    drawRoundedRect(
                        ctx,
                        contentRect.x - clipMargin,
                        contentRect.y - clipMargin,
                        contentRect.w + clipMargin * 2,
                        contentRect.h + clipMargin * 2,
                        (contentRect.r || 0) + clipMargin
                    );
                    ctx.clip();

                    applyShadowFromStyle(ctx, style, resScale, 1);

                    if (style.outlineSize > 0)
                    {
                        ctx.strokeStyle = toRgba(
                            style.outlineColor || '#000000',
                            style.outlineOpacity != null ? style.outlineOpacity : 1
                        );
                        ctx.lineWidth = outlinePx;
                    }

                    for (let i = 0; i < lines.length; i++)
                    {
                        const line = lines[i];
                        const lineWidth = ctx.measureText(line).width;

                        let x;
                        if (obj.align === 'center')
                        {
                            ctx.textAlign = 'left';
                            x = contentRect.x + (contentRect.w - lineWidth) / 2;
                        }
                        else if (obj.align === 'right')
                        {
                            ctx.textAlign = 'left';
                            x = contentRect.x + (contentRect.w - lineWidth);
                        }
                        else
                        {
                            ctx.textAlign = 'left';
                            x = contentRect.x;
                        }

                        const y = contentRect.y + i * lineHeight;

                        if (style.outlineSize > 0)
                        {
                            ctx.strokeText(line, x, y);
                        }
                        ctx.fillText(line, x, y);
                    }

                    ctx.restore();
                }
                else if (obj.type === 'image')
                {
                    const el = document.getElementById('ov-' + obj.id);
                    const content = el ? el.querySelector('.overlay-content') : null;
                    const imgEl = content ? content.querySelector('img') : null;
                    if (!imgEl || !imgEl.complete || imgEl.naturalWidth === 0)
                    {
                        return;
                    }

                    const imgW = imgEl.naturalWidth;
                    const imgH = imgEl.naturalHeight;
                    const aspect = imgH / imgW;

                    const geo = getImageBoxGeometry(obj, canvasW, canvasH, imgEl);
                    let centerX = geo.centerX;
                    let centerY = geo.centerY;

                    const boxW = geo.visualW;
                    const scale = geo.scale;

                    const borderBase = style.borderSize || 0;
                    const paddingBase = style.padding || 0;
                    const borderPxRaw = borderBase * resScale * scale;
                    const paddingPxRaw = paddingBase * resScale * scale;

                    const contentW = Math.max(0, boxW - 2 * (borderPxRaw + paddingPxRaw));
                    const contentH = contentW * aspect;
                    const boxH = contentH + 2 * (borderPxRaw + paddingPxRaw);

                    const oldBoxH = geo.visualH;
                    const topY = centerY - oldBoxH / 2;
                    centerY = topY + boxH / 2;

                    const layout = computeBoxModel(boxW, boxH, style, scale, resScale);
                    const borderRect = layout.borderRect;
                    const contentRect = layout.contentRect;
                    const borderPxFinal = layout.borderPx;

                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(obj.rotation * Math.PI / 180);

                    resetShadow(ctx);
                    beginRoundedClip(ctx, borderRect);

                    applyShadowFromStyle(ctx, style, resScale, scale);

                    if (contentRect.w > 0 && contentRect.h > 0)
                    {
                        ctx.drawImage(imgEl, contentRect.x, contentRect.y, contentRect.w, contentRect.h);
                    }

                    endClip(ctx);

                    drawBorderForStyle(ctx, style, borderRect, borderPxFinal, '#ffffff');

                    ctx.restore();
                }
            });
        }

        function drawCompositeLayer(ctx, geo)
        {
            if (state.images.back) drawImageCover(ctx, state.images.back, geo.back, state.params.backOffset);
            else drawPlaceholder(ctx, geo.back, "");
            if (state.images.front) drawImageCover(ctx, state.images.front, geo.front, state.params.frontOffset);
            else drawPlaceholder(ctx, geo.front, "");
            if (state.images.back) processAutoBleed(ctx, state.images.back, geo.back, geo.blendLeft, true, state.params.backOffset);
            if (state.images.front) processAutoBleed(ctx, state.images.front, geo.front, geo.blendRight, false, state.params.frontOffset);
            if (state.images.spine) ctx.drawImage(spineCacheCanvas, geo.spine.x, geo.spine.y);
            else { ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.lineWidth = 1; ctx.strokeRect(geo.spine.x, geo.spine.y, geo.spine.w, geo.spine.h); }
        }

        // --- SPINE CACHE LOGIC ---
        function updateSpineCache(destRect)
        {
            if (spineCacheCanvas.width !== destRect.w || spineCacheCanvas.height !== destRect.h)
            {
                spineCacheCanvas.width = destRect.w; spineCacheCanvas.height = destRect.h;
            }
            const sCtx = spineCacheCanvas.getContext('2d');
            sCtx.clearRect(0, 0, destRect.w, destRect.h);
            const img = state.images.spine;
            if (!img) return;
            const trimmedY = scanForBlackRows(img);
            const effectiveH = trimmedY.bottom - trimmedY.top;
            const crop = getCropCoords(img.width, effectiveH, destRect.w, destRect.h, 0);
            const finalCropY = crop.y + trimmedY.top;
            const mult = state.params.alphaMult; const pow = state.params.alphaPower;
            sCtx.drawImage(img, crop.x, finalCropY, crop.w, crop.h, 0, 0, destRect.w, destRect.h);
            if (mult === 0 || pow === 0) return;
            const imgData = sCtx.getImageData(0, 0, destRect.w, destRect.h);
            const data = imgData.data;
            const w = destRect.w; const h = destRect.h; const halfW = w / 2;
            const alphaFloats = new Float32Array(w);
            for (let x = 0; x < w; x++)
            {
                const dist = Math.min(x, w - x - 1);
                let alpha = Math.pow((dist / halfW) * mult, pow);
                if (alpha > 1.0) alpha = 1.0; if (alpha < 0.0) alpha = 0.0;
                alphaFloats[x] = alpha;
            }
            for (let y = 0; y < h; y++)
            {
                for (let x = 0; x < w; x++)
                {
                    const i = (y * w + x) * 4;
                    data[i + 3] = Math.floor(data[i + 3] * alphaFloats[x]);
                }
            }
            sCtx.putImageData(imgData, 0, 0);
        }

        function getCropCoords(imgW, imgH, targetW, targetH, offsetPct)
        {
            const targetAspect = targetW / targetH;
            const imgAspect = imgW / imgH;
            let cropW, cropH;
            if (targetAspect > imgAspect) { cropW = imgW; cropH = Math.floor(imgW / targetAspect); }
            else { cropH = imgH; cropW = Math.floor(imgH * targetAspect); }
            let x = (imgW - cropW) / 2;
            let y = (imgH - cropH) / 2;
            if (offsetPct && offsetPct !== 0 && cropW < imgW)
            {
                const shiftAmount = (offsetPct / 100) * imgW;
                x += shiftAmount;
                if (x < 0) x = 0; if (x + cropW > imgW) x = imgW - cropW;
            }
            return { x: Math.floor(x), y: Math.floor(y), w: cropW, h: cropH };
        }

        function drawImageCover(ctx, img, rect, offset)
        {
            const crop = getCropCoords(img.width, img.height, rect.w, rect.h, offset);
            ctx.drawImage(img, crop.x, crop.y, crop.w, crop.h, rect.x, rect.y, rect.w, rect.h);
        }

        function processAutoBleed(ctx, img, sourceRect, destRect, isBackCover, offset)
        {
            const crop = getCropCoords(img.width, img.height, sourceRect.w, sourceRect.h, offset);
            const widthRatio = sourceRect.w / crop.w;
            const neededSourceW = Math.floor(destRect.w / widthRatio);
            const availableGap = isBackCover ? (img.width - (crop.x + crop.w)) : crop.x;
            if (neededSourceW <= availableGap)
            {
                const srcX = isBackCover ? (crop.x + crop.w) : (crop.x - neededSourceW);
                ctx.drawImage(img, srcX, crop.y, neededSourceW, crop.h, destRect.x, destRect.y, destRect.w, destRect.h);
            } else
            {
                const tempCvs = document.createElement('canvas');
                tempCvs.width = destRect.w; tempCvs.height = destRect.h;
                const tCtx = tempCvs.getContext('2d');
                const srcX = isBackCover ? (crop.x + crop.w - neededSourceW) : crop.x;
                tCtx.save(); tCtx.scale(-1, 1);
                tCtx.drawImage(img, srcX, crop.y, neededSourceW, crop.h, -destRect.w, 0, destRect.w, destRect.h);
                tCtx.restore();
                ctx.drawImage(tempCvs, destRect.x, destRect.y);
            }
        }

        function scanForBlackRows(img)
        {
            const c = document.createElement('canvas');
            c.width = 1; c.height = img.height;
            const cx = c.getContext('2d');
            cx.drawImage(img, Math.floor(img.width / 2), 0, 1, img.height, 0, 0, 1, img.height);
            const data = cx.getImageData(0, 0, 1, img.height).data;
            let top = 0, bottom = img.height;
            for (let y = 0; y < img.height; y++)
            {
                if (data[y * 4] > 10 || data[y * 4 + 1] > 10 || data[y * 4 + 2] > 10) { top = y; break; }
            }
            for (let y = img.height - 1; y >= 0; y--)
            {
                if (data[y * 4] > 10 || data[y * 4 + 1] > 10 || data[y * 4 + 2] > 10) { bottom = y + 1; break; }
            }
            return { top, bottom };
        }

        function drawPlaceholder(ctx, rect, text)
        {
            ctx.fillStyle = "#222"; ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
            ctx.strokeStyle = "#444"; ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
            ctx.fillStyle = "#555"; ctx.font = "bold 50px Arial";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            if (text != null && text != '') ctx.fillText(text, rect.x + rect.w / 2, rect.y + rect.h / 2);
        }

        function updateLabels()
        {
            const geo = calculateGeometry();
            const setLabel = (id, key, r) =>
            {
                const el = document.getElementById(id);
                const img = state.images[key];
                const rectText = `[${r.x}, ${r.y}, ${r.w}, ${r.h}] px`;
                let srcText = "Empty"; let srcColor = "#666";
                if (img) { srcText = `Src: ${img.width}x${img.height} px`; srcColor = "#4caf50"; }
                el.innerHTML = `<div class="rect-info">${rectText}</div><div class="src-info" style="color:${srcColor}">${srcText}</div>`;
            };
            const el = document.getElementById('info-template');
            const img = state.images.template;
            const targetText = `[0, 0, ${state.params.width}, ${state.params.height}] px`;
            let srcText = state.isCustomTemplate ? "Custom Upload" : "Default Generated";
            let srcColor = state.isCustomTemplate ? "#e0912d" : "#007acc";
            if (img && state.isCustomTemplate) srcText = `Src: ${img.width}x${img.height} px`;
            el.innerHTML = `<div class="rect-info">${targetText}</div><div class="src-info" style="color:${srcColor}">${srcText}</div>`;
            setLabel('info-back', 'back', geo.back);
            setLabel('info-spine', 'spine', geo.spine);
            setLabel('info-front', 'front', geo.front);
        }

        function downloadCanvas()
        {
            const exportCanvas = document.createElement('canvas');
            renderToCanvas(exportCanvas, true);
            const link = document.createElement('a');
            link.download = 'Cover_Composite_HQ.jpg';
            link.href = exportCanvas.toDataURL('image/jpeg', 0.95);
            link.click();
        }

        function generateDefaultTemplate()
        {
            const tCvs = document.createElement('canvas');
            const W = state.params.width; const H = state.params.height; const SW = state.params.spineWidth;
            tCvs.width = W; tCvs.height = H;
            const tCtx = tCvs.getContext('2d');
            tCtx.fillStyle = "white"; tCtx.fillRect(0, 0, W, H);
            const bleed = Math.round(W * 0.01);
            tCtx.fillStyle = "rgba(255, 180, 180, 0.5)";
            tCtx.fillRect(0, 0, W, bleed); tCtx.fillRect(0, H - bleed, W, bleed);
            tCtx.fillRect(0, 0, bleed, H); tCtx.fillRect(W - bleed, 0, bleed, H);
            const spineX = (W - SW) / 2; tCtx.fillRect(spineX, 0, SW, H);
            tCtx.beginPath(); tCtx.strokeStyle = "#007acc"; tCtx.lineWidth = 3;
            tCtx.setLineDash([15, 15]);
            tCtx.moveTo(spineX, 0); tCtx.lineTo(spineX, H);
            tCtx.moveTo(spineX + SW, 0); tCtx.lineTo(spineX + SW, H);
            tCtx.stroke(); tCtx.setLineDash([]);
            tCtx.fillStyle = "white"; tCtx.fillRect(spineX + bleed, bleed, SW - (bleed * 2), H - (bleed * 2));
            const barW = 400; const barH = 250; const backW = spineX;
            tCtx.fillStyle = "yellow"; tCtx.fillRect(backW - barW - (bleed * 4), H - barH - (bleed * 4), barW, barH);
            tCtx.fillStyle = "black"; tCtx.font = "bold 30px Arial"; tCtx.textAlign = "center";
            tCtx.fillText("Barcode Area", backW - barW / 2 - (bleed * 4), H - barH / 2 - (bleed * 4));
            tCtx.fillStyle = "black"; tCtx.font = "bold 40px Arial";
            tCtx.save(); tCtx.translate(spineX + SW / 2, H / 2); tCtx.rotate(-Math.PI / 2);
            tCtx.fillText(`${(SW / DPI).toFixed(2)} in Spine`, 0, -10);
            tCtx.restore();
            tCtx.fillText("Back Cover", backW / 2, H / 2); tCtx.fillText("Front Cover", W - (backW / 2), H / 2);
            const img = new Image();
            img.onload = () =>
            {
                state.images.template = img;
                document.getElementById('dz-template').classList.add('has-image');
                updateLabels();
                requestRender();
            };
            img.src = tCvs.toDataURL('image/webp', 0.5);
        }

        window.addEventListener('resize', () =>
        {
            requestRender();
            renderDomOverlays();
        });

        generateDefaultTemplate();
    </script>
</body>
</html>
