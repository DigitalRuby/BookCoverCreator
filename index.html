<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Cover Creator</title>
    <style>
        :root
        {
            --bg-color: #1e1e1e;
            --panel-color: #252526;
            --text-color: #cccccc;
            --accent-color: #007acc;
            --border-color: #3e3e42;
            --hover-color: #2d2d30;
        }

        *
        {
            box-sizing: border-box;
        }

        body
        {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Left Sidebar --- */
        .sidebar
        {
            width: 320px;
            background-color: var(--panel-color);
            border-right: 1px solid var(--border-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-shrink: 0;
            overflow-y: auto;
        }

        h2
        {
            margin: 0;
            font-size: 1.1rem;
            color: #fff;
        }

        .params-grid
        {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .control-group
        {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 100%;
        }

            .control-group.full
            {
                grid-column: span 2;
            }

        label
        {
            font-size: 0.7rem;
            color: #aaa;
            white-space: nowrap;
        }

        input[type="number"]
        {
            background: #3c3c3c;
            border: 1px solid var(--border-color);
            color: white;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            width: 100%;
        }

            input[type="number"]:focus
            {
                outline: none;
                border-color: var(--accent-color);
            }

        /* Range Slider Styling */
        input[type=range]
        {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

            input[type=range]::-webkit-slider-thumb
            {
                -webkit-appearance: none;
                height: 14px;
                width: 14px;
                border-radius: 50%;
                background: var(--accent-color);
                cursor: pointer;
                margin-top: -5px;
            }

            input[type=range]::-webkit-slider-runnable-track
            {
                width: 100%;
                height: 4px;
                background: #444;
                border-radius: 2px;
            }

        h3
        {
            font-size: 0.85rem;
            color: #999;
            margin: 5px 0 0 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- Drop Zones --- */
        .zones-container
        {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .drop-zone
        {
            background: var(--hover-color);
            border: 2px dashed var(--border-color);
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 5px;
            overflow: hidden;
        }

            .drop-zone:hover
            {
                border-color: #666;
                background-color: #333;
            }

            .drop-zone.active
            {
                border-color: var(--accent-color);
                background-color: #2d2d30;
            }

            .drop-zone.has-image
            {
                border-style: solid;
                border-color: #4caf50;
                background-color: #1e2e1e;
            }

            .drop-zone.is-template
            {
                border-color: #555;
                background-color: #222;
            }

                .drop-zone.is-template.has-image
                {
                    border-color: #007acc;
                }

            .drop-zone p
            {
                margin: 0;
                font-size: 0.9rem;
                font-weight: 600;
                pointer-events: none;
            }

            .drop-zone .info-block
            {
                display: flex;
                flex-direction: column;
                gap: 2px;
                margin-top: 4px;
                pointer-events: none;
            }

            .drop-zone .rect-info
            {
                font-family: 'Consolas', 'Monaco', monospace;
                font-size: 0.75rem;
                color: #aaa;
                background: rgba(0,0,0,0.2);
                padding: 2px 4px;
                border-radius: 3px;
            }

            .drop-zone .src-info
            {
                font-size: 0.7rem;
                color: #666;
            }

        .zone-large
        {
            height: 100px;
        }

        .zone-medium
        {
            height: 80px;
        }

        /* --- Right Main Area --- */
        .main-area
        {
            flex-grow: 1;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: auto;
        }

        canvas
        {
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
            max-width: 95%;
            max-height: 95%;
            background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        button.btn-download
        {
            margin-top: auto;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            width: 100%;
            text-align: center;
        }

            button.btn-download:hover
            {
                background-color: #0063a5;
            }
    </style>
</head>
<body>

    <input type="file" id="file-template" hidden accept="image/*">
    <input type="file" id="file-back" hidden accept="image/*">
    <input type="file" id="file-spine" hidden accept="image/*">
    <input type="file" id="file-front" hidden accept="image/*">

    <div class="sidebar">
        <h2>Cover Parameters</h2>

        <div class="params-grid">
            <div class="control-group">
                <label>Width (px)</label>
                <input type="number" id="finalWidth">
            </div>
            <div class="control-group">
                <label>Height (px)</label>
                <input type="number" id="finalHeight">
            </div>
            <div class="control-group full">
                <label>Spine Width (px)</label>
                <input type="number" id="spineWidth">
            </div>
            <div class="control-group">
                <label title="Set to 0 to disable blend">Spine Alpha Mult</label>
                <input type="number" id="spineAlphaMultiplier" step="0.1">
            </div>
            <div class="control-group">
                <label title="Set to 0 to disable blend">Spine Alpha Power</label>
                <input type="number" id="spineAlphaPower" step="0.1">
            </div>

            <div class="control-group full">
                <label style="display:flex; justify-content:space-between;">
                    <span>Artwork Opacity</span>
                    <span id="opacityVal">75%</span>
                </label>
                <input type="range" id="previewAlpha" min="0" max="1" step="0.01">
            </div>
        </div>

        <h3>Images</h3>
        <div class="zones-container">

            <div class="drop-zone zone-medium is-template" id="dz-template" onclick="triggerFile('file-template')">
                <p>Background Template</p>
                <div class="info-block" id="info-template">
                    <div class="src-info">Default Loaded</div>
                </div>
            </div>

            <div class="drop-zone zone-large" id="dz-back" onclick="triggerFile('file-back')">
                <p>Back Cover</p>
                <div class="info-block" id="info-back"></div>
            </div>

            <div class="drop-zone zone-medium" id="dz-spine" onclick="triggerFile('file-spine')">
                <p>Spine</p>
                <div class="info-block" id="info-spine"></div>
            </div>

            <div class="drop-zone zone-large" id="dz-front" onclick="triggerFile('file-front')">
                <p>Front Cover</p>
                <div class="info-block" id="info-front"></div>
            </div>
        </div>

        <button class="btn-download" onclick="downloadCanvas()">Download JPG</button>
    </div>

    <div class="main-area">
        <canvas id="previewCanvas"></canvas>
    </div>

    <script>
        // --- State & Persistence ---
        const defaultParams = {
            width: 4039,
            height: 2775,
            spineWidth: 366,
            alphaMult: 2.0,
            alphaPower: 1.0,
            previewAlpha: 0.75 // Default 75%
        };

        let savedParams = localStorage.getItem('coverParams');
        const params = savedParams ? JSON.parse(savedParams) : defaultParams;

        // Fallback if loading old state without alpha
        if (typeof params.previewAlpha === 'undefined') params.previewAlpha = 0.75;

        const state = {
            params: params,
            images: {
                template: null,
                front: null,
                back: null,
                spine: null
            }
        };

        // --- DOM Elements ---
        const dom = {
            width: document.getElementById('finalWidth'),
            height: document.getElementById('finalHeight'),
            spineW: document.getElementById('spineWidth'),
            aMult: document.getElementById('spineAlphaMultiplier'),
            aPower: document.getElementById('spineAlphaPower'),
            pAlpha: document.getElementById('previewAlpha'),
            pAlphaVal: document.getElementById('opacityVal'),
            canvas: document.getElementById('previewCanvas')
        };

        // Init Values
        dom.width.value = state.params.width;
        dom.height.value = state.params.height;
        dom.spineW.value = state.params.spineWidth;
        dom.aMult.value = state.params.alphaMult;
        dom.aPower.value = state.params.alphaPower;
        dom.pAlpha.value = state.params.previewAlpha;
        dom.pAlphaVal.textContent = Math.round(state.params.previewAlpha * 100) + "%";

        const ctx = dom.canvas.getContext('2d', { willReadFrequently: true });

        // --- Template Generation (Replaces Static Base64) ---
        function generateDefaultTemplate()
        {
            // Create an offscreen canvas to draw the KDP-style template
            const tCvs = document.createElement('canvas');
            const W = state.params.width;
            const H = state.params.height;
            const SW = state.params.spineWidth;
            tCvs.width = W;
            tCvs.height = H;
            const tCtx = tCvs.getContext('2d');

            // 1. Background White
            tCtx.fillStyle = "white";
            tCtx.fillRect(0, 0, W, H);

            // 2. Pink Bleed Area (0.125" approx 37px at 300dpi, but we scale to fit)
            // We'll use a proportional bleed for visualization (approx 1.5% of width)
            const bleed = Math.round(W * 0.01);
            tCtx.fillStyle = "rgba(255, 180, 180, 0.5)"; // Light Pink
            // Outer border
            tCtx.fillRect(0, 0, W, bleed); // Top
            tCtx.fillRect(0, H - bleed, W, bleed); // Bottom
            tCtx.fillRect(0, 0, bleed, H); // Left
            tCtx.fillRect(W - bleed, 0, bleed, H); // Right

            // Spine Bleed
            const spineX = (W - SW) / 2;
            tCtx.fillRect(spineX, 0, SW, H); // Spine area often has safety pink in templates

            // 3. Spine Guides (Blue Dashed)
            tCtx.beginPath();
            tCtx.strokeStyle = "#007acc";
            tCtx.lineWidth = 3;
            tCtx.setLineDash([15, 15]);
            tCtx.moveTo(spineX, 0);
            tCtx.lineTo(spineX, H);
            tCtx.moveTo(spineX + SW, 0);
            tCtx.lineTo(spineX + SW, H);
            tCtx.stroke();
            tCtx.setLineDash([]);

            // 4. White Spine Safe Area (Middle of spine)
            tCtx.fillStyle = "white";
            tCtx.fillRect(spineX + bleed, bleed, SW - (bleed * 2), H - (bleed * 2));

            // 5. Barcode (Yellow Box)
            const barW = 400;
            const barH = 250;
            // Standard placement: Bottom Right of Back Cover
            // Back cover is on the Left
            const backW = spineX;
            tCtx.fillStyle = "yellow";
            tCtx.fillRect(backW - barW - (bleed * 4), H - barH - (bleed * 4), barW, barH);

            tCtx.fillStyle = "black";
            tCtx.font = "bold 30px Arial";
            tCtx.textAlign = "center";
            tCtx.fillText("Barcode Area", backW - barW / 2 - (bleed * 4), H - barH / 2 - (bleed * 4));

            // 6. Text Labels
            tCtx.fillStyle = "black";
            tCtx.font = "bold 40px Arial";

            // Spine Text
            tCtx.save();
            tCtx.translate(spineX + SW / 2, H / 2);
            tCtx.rotate(-Math.PI / 2);
            tCtx.fillText(`${SW}px Spine`, 0, -10);
            tCtx.restore();

            // Cover Text
            tCtx.fillText("Back Cover", backW / 2, H / 2);
            tCtx.fillText("Front Cover", W - (backW / 2), H / 2);

            // Helper
            tCtx.font = "italic 30px Arial";
            tCtx.fillStyle = "red";
            tCtx.textAlign = "left";
            tCtx.fillText("Pink Area = Bleed / Trim", bleed * 2, bleed * 4);

            // Convert to Image
            const img = new Image();
            img.onload = () =>
            {
                state.images.template = img;
                // Mark dropzone as loaded
                document.getElementById('dz-template').classList.add('has-image');
                updateLabels();
                requestRender();
            };
            img.src = tCvs.toDataURL('image/webp', 0.5); // Compressed webp string
        }

        // --- Interaction ---
        const inputs = ['finalWidth', 'finalHeight', 'spineWidth', 'spineAlphaMultiplier', 'spineAlphaPower'];
        inputs.forEach(id =>
        {
            document.getElementById(id).addEventListener('input', (e) =>
            {
                const key = id === 'spineAlphaMultiplier' ? 'alphaMult' :
                    id === 'spineAlphaPower' ? 'alphaPower' :
                        id === 'spineWidth' ? 'spineWidth' :
                            id === 'finalWidth' ? 'width' : 'height';

                const val = parseFloat(e.target.value);
                if (!isNaN(val))
                {
                    state.params[key] = val;
                    saveState();
                    updateLabels();
                    // If template is default, regenerate it to match new dims
                    if (state.images.template && state.images.template.src.startsWith('data:'))
                    {
                        generateDefaultTemplate();
                    } else
                    {
                        requestRender();
                    }
                }
            });
        });

        dom.pAlpha.addEventListener('input', (e) =>
        {
            state.params.previewAlpha = parseFloat(e.target.value);
            dom.pAlphaVal.textContent = Math.round(state.params.previewAlpha * 100) + "%";
            saveState();
            requestRender();
        });

        function saveState()
        {
            localStorage.setItem('coverParams', JSON.stringify(state.params));
        }

        window.triggerFile = function (id) { document.getElementById(id).click(); };

        function setupImageHandler(zoneId, fileInputId, imageKey, infoId)
        {
            const zone = document.getElementById(zoneId);
            const fileInput = document.getElementById(fileInputId);

            const handleFile = (file) =>
            {
                if (file && file.type.startsWith('image/'))
                {
                    const reader = new FileReader();
                    reader.onload = (e) =>
                    {
                        const img = new Image();
                        img.onload = () =>
                        {
                            state.images[imageKey] = img;
                            zone.classList.add('has-image');
                            updateLabels();
                            requestRender();
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
            zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('active'); });
            zone.addEventListener('dragleave', (e) => { e.preventDefault(); zone.classList.remove('active'); });
            zone.addEventListener('drop', (e) =>
            {
                e.preventDefault();
                zone.classList.remove('active');
                handleFile(e.dataTransfer.files[0]);
            });
        }

        setupImageHandler('dz-template', 'file-template', 'template', 'info-template');
        setupImageHandler('dz-back', 'file-back', 'back', 'info-back');
        setupImageHandler('dz-front', 'file-front', 'front', 'info-front');
        setupImageHandler('dz-spine', 'file-spine', 'spine', 'info-spine');

        // --- Label Logic ---
        function updateLabels()
        {
            const geo = calculateGeometry();

            const setLabel = (id, key, r) =>
            {
                const el = document.getElementById(id);
                const img = state.images[key];
                const rectText = `[${r.x}, ${r.y}, ${r.w}, ${r.h}]`;
                let srcText = "Empty";
                let srcColor = "#666";

                if (img)
                {
                    srcText = `Src: ${img.width}x${img.height}`;
                    srcColor = "#4caf50";
                }
                el.innerHTML = `<div class="rect-info">${rectText}</div><div class="src-info" style="color:${srcColor}">${srcText}</div>`;
            };

            const setTemplateLabel = () =>
            {
                const el = document.getElementById('info-template');
                const img = state.images.template;
                const targetText = `[0, 0, ${state.params.width}, ${state.params.height}]`;
                let srcText = "Default Generated";
                let srcColor = "#666";

                if (img)
                {
                    if (img.src.startsWith('data:'))
                    {
                        srcText = "Default Template";
                        srcColor = "#aaa";
                    } else
                    {
                        srcText = `Src: ${img.width}x${img.height}`;
                        srcColor = "#007acc";
                    }
                }
                el.innerHTML = `<div class="rect-info">${targetText}</div><div class="src-info" style="color:${srcColor}">${srcText}</div>`;
            };

            setTemplateLabel();
            setLabel('info-back', 'back', geo.back);
            setLabel('info-spine', 'spine', geo.spine);
            setLabel('info-front', 'front', geo.front);
        }

        // --- Rendering Logic ---
        let renderTimeout;
        function requestRender()
        {
            if (renderTimeout) clearTimeout(renderTimeout);
            renderTimeout = setTimeout(() => { renderToCanvas(dom.canvas, false); }, 30);
        }

        function calculateGeometry()
        {
            const p = state.params;
            const frontWidth = Math.floor((p.width - p.spineWidth) / 2);
            const backWidth = p.width - frontWidth - p.spineWidth;
            const blendWidth = Math.floor(p.spineWidth / 2);
            return {
                final: { w: p.width, h: p.height },
                spine: { x: backWidth, y: 0, w: p.spineWidth, h: p.height },
                back: { x: 0, y: 0, w: backWidth, h: p.height },
                front: { x: backWidth + p.spineWidth, y: 0, w: frontWidth, h: p.height },
                blendLeft: { x: backWidth, y: 0, w: blendWidth, h: p.height },
                blendRight: { x: backWidth + blendWidth, y: 0, w: blendWidth, h: p.height }
            };
        }

        function getCropCoords(imgW, imgH, targetW, targetH)
        {
            const targetAspect = targetW / targetH;
            const imgAspect = imgW / imgH;
            let cropW, cropH;
            if (targetAspect > imgAspect)
            {
                cropW = imgW;
                cropH = Math.floor(imgW / targetAspect);
            } else
            {
                cropH = imgH;
                cropW = Math.floor(imgH * targetAspect);
            }
            return { x: Math.floor((imgW - cropW) / 2), y: Math.floor((imgH - cropH) / 2), w: cropW, h: cropH };
        }

        function renderToCanvas(targetCanvas, isExport)
        {
            const geo = calculateGeometry();

            if (targetCanvas.width !== geo.final.w || targetCanvas.height !== geo.final.h)
            {
                targetCanvas.width = geo.final.w;
                targetCanvas.height = geo.final.h;
            }

            const tCtx = targetCanvas.getContext('2d');
            tCtx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);

            // 1. Draw Template (Only in Preview Mode)
            if (!isExport && state.images.template)
            {
                tCtx.drawImage(state.images.template, 0, 0, geo.final.w, geo.final.h);
            }

            // 2. Composite Layer
            const offCanvas = document.createElement('canvas');
            offCanvas.width = geo.final.w;
            offCanvas.height = geo.final.h;
            const oCtx = offCanvas.getContext('2d');

            drawCompositeLayer(oCtx, geo);

            tCtx.save();
            if (!isExport)
            {
                tCtx.globalAlpha = state.params.previewAlpha;
            }
            tCtx.drawImage(offCanvas, 0, 0);
            tCtx.restore();
        }

        function drawCompositeLayer(ctx, geo)
        {
            if (state.images.back)
            {
                drawImageCover(ctx, state.images.back, geo.back);
            } else
            {
                drawPlaceholder(ctx, geo.back, "");
            }
            if (state.images.front)
            {
                drawImageCover(ctx, state.images.front, geo.front);
            } else
            {
                drawPlaceholder(ctx, geo.front, "");
            }
            if (state.images.back)
            {
                processAutoBleed(ctx, state.images.back, geo.back, geo.blendLeft, true);
            }
            if (state.images.front)
            {
                processAutoBleed(ctx, state.images.front, geo.front, geo.blendRight, false);
            }
            if (state.images.spine)
            {
                processSpine(ctx, state.images.spine, geo.spine);
            } else
            {
                ctx.strokeStyle = "rgba(255,255,255,0.2)";
                ctx.lineWidth = 1;
                ctx.strokeRect(geo.spine.x, geo.spine.y, geo.spine.w, geo.spine.h);
            }
        }

        function drawImageCover(ctx, img, rect)
        {
            const crop = getCropCoords(img.width, img.height, rect.w, rect.h);
            ctx.drawImage(img, crop.x, crop.y, crop.w, crop.h, rect.x, rect.y, rect.w, rect.h);
        }

        function processAutoBleed(ctx, img, sourceRect, destRect, isBackCover)
        {
            const crop = getCropCoords(img.width, img.height, sourceRect.w, sourceRect.h);
            const widthRatio = sourceRect.w / crop.w;
            const neededSourceW = Math.floor(destRect.w / widthRatio);
            const availableGap = Math.floor((img.width - crop.w) / 2);

            if (neededSourceW <= availableGap)
            {
                const srcX = isBackCover ? (crop.x + crop.w) : (crop.x - neededSourceW);
                ctx.drawImage(img, srcX, crop.y, neededSourceW, crop.h, destRect.x, destRect.y, destRect.w, destRect.h);
            } else
            {
                const tempCvs = document.createElement('canvas');
                tempCvs.width = destRect.w;
                tempCvs.height = destRect.h;
                const tCtx = tempCvs.getContext('2d');
                const srcX = isBackCover ? (crop.x + crop.w - neededSourceW) : crop.x;

                tCtx.save();
                tCtx.scale(-1, 1);
                tCtx.drawImage(img, srcX, crop.y, neededSourceW, crop.h, -destRect.w, 0, destRect.w, destRect.h);
                tCtx.restore();
                ctx.drawImage(tempCvs, destRect.x, destRect.y);
            }
        }

        function processSpine(ctx, img, destRect)
        {
            const trimmedY = scanForBlackRows(img);
            const effectiveH = trimmedY.bottom - trimmedY.top;
            const crop = getCropCoords(img.width, effectiveH, destRect.w, destRect.h);
            const finalCropY = crop.y + trimmedY.top;
            const mult = state.params.alphaMult;
            const pow = state.params.alphaPower;

            if (mult === 0 || pow === 0)
            {
                ctx.drawImage(img, crop.x, finalCropY, crop.w, crop.h, destRect.x, destRect.y, destRect.w, destRect.h);
                return;
            }
            const sCanvas = document.createElement('canvas');
            sCanvas.width = destRect.w;
            sCanvas.height = destRect.h;
            const sCtx = sCanvas.getContext('2d');
            sCtx.drawImage(img, crop.x, finalCropY, crop.w, crop.h, 0, 0, destRect.w, destRect.h);
            const imgData = sCtx.getImageData(0, 0, destRect.w, destRect.h);
            const data = imgData.data;
            const w = destRect.w;
            const halfW = w / 2;
            for (let y = 0; y < destRect.h; y++)
            {
                for (let x = 0; x < w; x++)
                {
                    const i = (y * w + x) * 4;
                    const dist = Math.min(x, w - x - 1);
                    let alpha = Math.pow((dist / halfW) * mult, pow);
                    if (alpha > 1.0) alpha = 1.0;
                    if (alpha < 0.0) alpha = 0.0;
                    data[i + 3] = Math.floor(data[i + 3] * alpha);
                }
            }
            sCtx.putImageData(imgData, 0, 0);
            ctx.drawImage(sCanvas, destRect.x, destRect.y);
        }

        function scanForBlackRows(img)
        {
            const c = document.createElement('canvas');
            c.width = 1; c.height = img.height;
            const cx = c.getContext('2d');
            cx.drawImage(img, Math.floor(img.width / 2), 0, 1, img.height, 0, 0, 1, img.height);
            const data = cx.getImageData(0, 0, 1, img.height).data;
            let top = 0, bottom = img.height;
            for (let y = 0; y < img.height; y++)
            {
                if (data[y * 4] > 10 || data[y * 4 + 1] > 10 || data[y * 4 + 2] > 10) { top = y; break; }
            }
            for (let y = img.height - 1; y >= 0; y--)
            {
                if (data[y * 4] > 10 || data[y * 4 + 1] > 10 || data[y * 4 + 2] > 10) { bottom = y + 1; break; }
            }
            return { top, bottom };
        }

        function drawPlaceholder(ctx, rect, text)
        {
            ctx.fillStyle = "#222";
            ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
            ctx.strokeStyle = "#444";
            ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
            ctx.fillStyle = "#555";
            ctx.font = "bold 50px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            if (text != null && text != '')
            {
                ctx.fillText(text, rect.x + rect.w / 2, rect.y + rect.h / 2);
            }
        }

        function downloadCanvas()
        {
            const exportCanvas = document.createElement('canvas');
            renderToCanvas(exportCanvas, true);
            const link = document.createElement('a');
            link.download = 'Cover_Composite_HQ.jpg';
            link.href = exportCanvas.toDataURL('image/jpeg', 0.95);
            link.click();
        }

        // Init
        generateDefaultTemplate();
    </script>
